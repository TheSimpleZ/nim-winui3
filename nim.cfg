# WinUI 3 ships x64 (and arm64) only, and the Windows App SDK runtime staged
# beside the exe is x64. Building 32-bit produces a binary that cannot load it,
# so the target is pinned rather than inherited from whichever toolchain
# happens to be first on PATH — `nimble` and a direct `nim c` do not always
# agree, and the disagreement surfaces as a pointer-size assertion in nimbase.h
# rather than as anything about WinUI.
--cpu:amd64
